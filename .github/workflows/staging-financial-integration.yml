name: Staging financial integration (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-financial-manual
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_DATABASE_URL: ${{ secrets.MEUDINHEIRO_STAGING_DATABASE_URL }}
    steps:
      - name: Reject missing or wrong staging database
        shell: bash
        run: |
          node <<'NODE'
          const expectedProject = 'jewoooybinxfcssyixff';
          const raw = process.env.STAGING_DATABASE_URL;
          function fail() {
            console.error('::error::Database connection is missing, malformed, or does not target the isolated Supabase staging project.');
            process.exit(1);
          }
          if (!raw) fail();
          let url;
          try { url = new URL(raw); } catch { fail(); }
          if (!['postgres:', 'postgresql:'].includes(url.protocol)) fail();
          if (!url.password || !url.username || !url.hostname) fail();
          // Direct Supabase connection or Supavisor transaction/session pooler.
          // Never trust a project ID appearing only in a password, query or fragment.
          const direct = url.hostname === `db.${expectedProject}.supabase.co`
            && decodeURIComponent(url.username) === 'postgres';
          const pooled = /^(?:aws-[0-9]+-[a-z0-9-]+\.pooler\.supabase\.com)$/.test(url.hostname)
            && decodeURIComponent(url.username) === `postgres.${expectedProject}`;
          if (!direct && !pooled) fail();
          NODE
      - name: Checkout reviewed integration test commit
        uses: actions/checkout@v4
        with:
          ref: 9dfc5b693a56a3f78ff2f43bf791d03f6450a738
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test financial authorization and concurrency against staging
        run: bun run scripts/staging-financial-tests.ts
