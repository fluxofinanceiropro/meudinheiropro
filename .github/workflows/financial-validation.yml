name: Financial validation (no production changes)
on:
  push:
    branches:
      - test/ci-financial-validation-20261024
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test
      - name: Check build
        run: bun run build
