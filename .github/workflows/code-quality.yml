name: Code quality (no database)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
